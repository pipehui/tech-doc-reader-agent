services:
  redis:
    image: redis:8
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - ./tech_doc_agent/data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 60
      start_period: 5s

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        IMAGE_COMMIT_SHA: ${DEPLOYMENT_COMMIT_SHA:-}
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      PRIMARY_MODEL: ${PRIMARY_MODEL:-}
      MODEL_PROVIDER_ID: ${MODEL_PROVIDER_ID:-openai_compatible}
      MODEL_PRICE_TABLE_PATH: ${MODEL_PRICE_TABLE_PATH:-}
      DEPLOYMENT_COMMIT_SHA: ${DEPLOYMENT_COMMIT_SHA:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY}
      EMBEDDING_API_BASE: ${EMBEDDING_API_BASE:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      TAVILY_DAILY_LIMIT: ${TAVILY_DAILY_LIMIT:-10}
      BACKUP_API_BASE: ${BACKUP_API_BASE:-}
      BACKUP_API_KEY: ${BACKUP_API_KEY:-}
      BACKUP_MODEL: ${BACKUP_MODEL:-}
      LANGGRAPH_RECURSION_LIMIT: ${LANGGRAPH_RECURSION_LIMIT:-80}
      REQUEST_MAX_SECONDS: ${REQUEST_MAX_SECONDS:-300}
      WORKFLOW_MAX_LLM_CALLS: ${WORKFLOW_MAX_LLM_CALLS:-32}
      WORKFLOW_MAX_TOOL_CALLS: ${WORKFLOW_MAX_TOOL_CALLS:-48}
      WORKFLOW_MAX_TOTAL_TOKENS: ${WORKFLOW_MAX_TOTAL_TOKENS:-0}
      WORKFLOW_MAX_ESTIMATED_COST_USD: ${WORKFLOW_MAX_ESTIMATED_COST_USD:-0}
      LANGFUSE_ENABLED: ${LANGFUSE_ENABLED:-false}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-https://cloud.langfuse.com}
      LANGFUSE_FLUSH_ON_REQUEST: ${LANGFUSE_FLUSH_ON_REQUEST:-false}
      LANGFUSE_ENVIRONMENT: ${LANGFUSE_ENVIRONMENT:-local}
      LANGFUSE_RELEASE: ${LANGFUSE_RELEASE:-}
      PYTHONPATH: /app
      PROXY_URL: ${PROXY_URL:-}
      REDIS_SETUP_MAX_ATTEMPTS: ${REDIS_SETUP_MAX_ATTEMPTS:-60}
      REDIS_SETUP_RETRY_SECONDS: ${REDIS_SETUP_RETRY_SECONDS:-1.0}
      TRANSPORT_RETRY_MAX_ATTEMPTS: ${TRANSPORT_RETRY_MAX_ATTEMPTS:-3}
      TRANSPORT_RETRY_INITIAL_DELAY_SECONDS: ${TRANSPORT_RETRY_INITIAL_DELAY_SECONDS:-0.25}
      TRANSPORT_RETRY_MAX_DELAY_SECONDS: ${TRANSPORT_RETRY_MAX_DELAY_SECONDS:-2.0}
      TRANSPORT_RETRY_BACKOFF_MULTIPLIER: ${TRANSPORT_RETRY_BACKOFF_MULTIPLIER:-2.0}
      TRANSPORT_RETRY_JITTER_RATIO: ${TRANSPORT_RETRY_JITTER_RATIO:-0.2}
      TRANSPORT_RETRY_MAX_RETRY_AFTER_SECONDS: ${TRANSPORT_RETRY_MAX_RETRY_AFTER_SECONDS:-30.0}
      GUARDRAIL_APPROVAL_TTL_SECONDS: ${GUARDRAIL_APPROVAL_TTL_SECONDS:-900}
      MAX_REFLECTION_ROUNDS: ${MAX_REFLECTION_ROUNDS:-1}
      CONTEXT_COMPACTION_MAX_MESSAGES: ${CONTEXT_COMPACTION_MAX_MESSAGES:-0}
      CONTEXT_COMPACTION_MAX_SERIALIZED_BYTES: ${CONTEXT_COMPACTION_MAX_SERIALIZED_BYTES:-0}
      CONTEXT_COMPACTION_KEEP_RECENT_TURNS: ${CONTEXT_COMPACTION_KEEP_RECENT_TURNS:-4}
      CONTEXT_SUMMARY_MAX_CHARS: ${CONTEXT_SUMMARY_MAX_CHARS:-12000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./tech_doc_agent:/app/tech_doc_agent
      - ./graphs:/app/graphs:ro
      - ./tech_doc_agent/data:/app/tech_doc_agent/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    command: uvicorn tech_doc_agent.app.api.server:app --host 0.0.0.0 --port 8000 --reload
