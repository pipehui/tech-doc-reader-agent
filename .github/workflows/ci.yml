name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ruff
        run: ruff check tech_doc_agent tests evals

      - name: Mypy
        run: mypy tech_doc_agent/app/core tech_doc_agent/app/api/schemas.py

      - name: Pytest
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install frontend dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Install static smoke dependencies
        working-directory: ${{ github.workspace }}
        run: pip install "fastapi>=0.115,<1.0" "httpx>=0.27,<1.0" "pytest>=8.3,<9.0"

      - name: FastAPI static smoke
        working-directory: ${{ github.workspace }}
        run: python -m pytest tests/test_frontend_static.py -q
